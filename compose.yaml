services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      NODE_ENV: production
      DATA_DIR: /app/data
      BACKUP_DIR: /app/backups
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
